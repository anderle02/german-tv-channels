name: Senderliste aktualisieren

on:
  schedule:
    - cron: "23 3 * * 1" # montags 03:23 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-channel-list
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Liste aktualisieren
        run: node scripts/update.mjs
      - name: Änderungen committen
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "Senderliste automatisch aktualisiert"
            git push
          else
            echo "Keine Änderungen."
          fi
